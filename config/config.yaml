# Default Configuration settings for Autonomous Job Search & Application Agent

preferences:
  seniority_level: "Fresher / Entry Level" # Fresher (0 years exp)
  max_experience_gap_years: 0
  locations:
    - "India"
    - "Bengaluru, India"
    - "Gurugram, India"
    - "Hyderabad, India"
    - "Pune, India"
    - "Noida, India"
    - "Mumbai, India"
    - "Remote - India"
  remote_preference: "remote_preferred"
  salary_min_usd: 0
  daily_application_limit: 25
  auto_apply_enabled: false

blacklists:
  companies:
    - "Revature"
    - "TCS"
    - "Infosys"
  title_keywords:
    - "Senior"
    - "Lead"
    - "Principal"
    - "Architect"
    - "Director"
    - "Manager"
    - "Staff"
    - "VP"
    - "Sales Representative"
    - "Unpaid Intern"
  location_exclusions:
    - "Onsite Only"

matching:
  min_score_threshold: 70
  weights:
    skills: 0.25
    tech_stack: 0.25
    experience: 0.20
    domain: 0.15
    ats_keywords: 0.15

notifications:
  desktop_enabled: true
  console_enabled: true
